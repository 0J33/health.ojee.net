# health.ojee.net — nginx site. A RECORD of what is installed on disinteg as
# /etc/nginx/sites-available/health.ojee.net (deploy/install-root.sh puts it
# there). Editing this file changes nothing until it is copied and nginx is
# reloaded.
#
# TLS ends at Cloudflare; cloudflared reaches this server on :80. One Node
# process on 127.0.0.1:5020 serves both the API and the static app, so this
# is a plain proxy. Cache headers and the CSP are set by the app itself.

server {
    listen 80;
    server_name health.ojee.net;

    # A Hevy export can be a few MB; the app caps it at 5.
    client_max_body_size 6m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    # Server-Sent Events: no buffering, and a read timeout far longer than
    # the app's 25-second heartbeat.
    location = /api/events {
        proxy_pass http://127.0.0.1:5020;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:5020;
        proxy_read_timeout 120s;
    }
}
